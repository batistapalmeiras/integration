<!doctype html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#78b9a4" />
    <meta name="description" content="Sistema de integração de novos membros da Igreja Batista Palmeiras" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Integração" />
    <title>Integração — Batista Palmeiras</title>
    <style>
      .splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #ffffff;
      }
      .splash img {
        width: 72px;
        height: 72px;
      }
      .splash span {
        position: relative;
        width: 160px;
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: #e8f2ee;
      }
      .splash span::after {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: 999px;
        background: #78b9a4;
        animation: splash-slide 1.2s ease-in-out infinite;
      }
      @keyframes splash-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash span::after {
          animation-duration: 3s;
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div class="splash" role="status" aria-label="Carregando">
        <img src="/pwa-192x192.png" alt="" />
        <span></span>
      </div>
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
