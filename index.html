<!doctype html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#78b9a4" />
    <meta name="description" content="Sistema de integração de novos membros da Igreja Batista Palmeiras" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Integração" />
    <title>Integração — Batista Palmeiras</title>
    <style>
      .splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #ffffff;
        font-family: 'Inter', system-ui, sans-serif;
      }
      .splash img {
        width: 72px;
        height: 72px;
        animation: splash-breathe 1.6s ease-in-out infinite;
      }
      .splash p {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        color: #1c2421;
      }
      .splash span {
        width: 28px;
        height: 28px;
        border: 3px solid #e8f2ee;
        border-top-color: #78b9a4;
        border-radius: 50%;
        animation: splash-spin 0.8s linear infinite;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes splash-breathe {
        50% {
          transform: scale(0.92);
          opacity: 0.7;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash img,
        .splash span {
          animation-duration: 3s;
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div class="splash" role="status" aria-label="Carregando">
        <img src="/pwa-192x192.png" alt="" />
        <p>Igreja Batista Palmeiras</p>
        <span></span>
      </div>
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
